[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baloney-detection-kit"
version = "3.0.0"
description = "Epistemic friction, behavioral diagnosis, and validation for AI conversations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "JR Cruciani", email = "jrcruciani@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6",
]

[project.optional-dependencies]
gemini = ["google-generativeai>=0.7"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/jrcruciani/baloney-detection-kit"
Repository = "https://github.com/jrcruciani/baloney-detection-kit"
Issues = "https://github.com/jrcruciani/baloney-detection-kit/issues"

[project.scripts]
bdk = "bdk.cli:app"
robopsych = "bdk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that hit real LLM APIs (skip in CI with -m 'not integration')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
