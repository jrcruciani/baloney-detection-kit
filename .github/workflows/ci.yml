name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  base-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install only the base package in an isolated environment
        run: |
          python -m venv .venv-base
          .venv-base/bin/python -m pip install .

      - name: Check the CLI without provider SDKs
        run: |
          .venv-base/bin/python - <<'PY'
          from importlib.util import find_spec
          import bdk.cli

          for module in ("anthropic", "openai", "google"):
              assert find_spec(module) is None, f"Unexpected SDK installed: {module}"
          PY
          .venv-base/bin/bdk apply compact

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=bdk --cov-report=term-missing --cov-fail-under=60
