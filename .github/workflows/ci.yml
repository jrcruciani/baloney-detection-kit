name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  base-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install only the base package in an isolated environment
        run: |
          python -m venv .venv-base
          .venv-base/bin/python -m pip install .

      - name: Check the CLI without provider SDKs
        run: |
          .venv-base/bin/python - <<'PY'
          from importlib.util import find_spec
          import bdk.cli

          for module in ("anthropic", "openai", "google"):
              assert find_spec(module) is None, f"Unexpected SDK installed: {module}"
          PY
          .venv-base/bin/bdk apply compact
          .venv-base/bin/bdk apply compact --lang es --output "$RUNNER_TEMP/prompt-compact.es.md"
          cmp prompts/intervention/es/prompt-compact.md "$RUNNER_TEMP/prompt-compact.es.md"
          .venv-base/bin/bdk apply full --lang es --output "$RUNNER_TEMP/prompt-full.es.md"
          cmp prompts/intervention/es/prompt-full.md "$RUNNER_TEMP/prompt-full.es.md"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/

      - name: Check formatting with ruff
        run: ruff format --check src/ tests/ scripts/

      - name: Check types with mypy
        run: mypy src/bdk scripts/check_markdown_links.py scripts/sync_prompts.py

      - name: Check repository Markdown links offline
        run: python scripts/check_markdown_links.py

      - name: Check intervention prompt synchronization
        run: python scripts/sync_prompts.py --check

      - name: Run tests with coverage
        run: >-
          pytest -m "not integration" --cov=bdk --cov-report=xml
          --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage for Python ${{ matrix.python-version }}
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the environment to audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Audit resolved dependencies (report-only initially)
        id: audit
        continue-on-error: true
        run: pip-audit

      - name: Summarize audit outcome
        if: always()
        run: |
          echo "## Dependency audit (report-only)" >> "$GITHUB_STEP_SUMMARY"
          echo "Outcome: ${{ steps.audit.outcome }}. See the audit step for findings and errors." >> "$GITHUB_STEP_SUMMARY"
